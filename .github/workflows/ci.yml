name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - name: Verify tests ignore inherited proxy configuration
        run: >-
          env -u NO_PROXY -u no_proxy
          HTTP_PROXY=http://127.0.0.1:1 HTTPS_PROXY=http://127.0.0.1:1 ALL_PROXY=http://127.0.0.1:1
          http_proxy=http://127.0.0.1:1 https_proxy=http://127.0.0.1:1 all_proxy=http://127.0.0.1:1
          cargo test --all-targets --locked --offline
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Verify downstream TLS backend compatibility
        run: ./tests/test_tls_backends.py
      - name: Verify release target contract
        run: |
          grep -q 'x86_64-unknown-linux-musl' .github/workflows/release.yml
          ! grep -q 'x86_64-apple-darwin' .github/workflows/release.yml
          grep -q 'aarch64-apple-darwin' .github/workflows/release.yml
          grep -q 'x86_64-pc-windows-msvc' .github/workflows/release.yml
          grep -q 'environment: macos-release' .github/workflows/release.yml
          grep -q './scripts/sign_and_notarize_macos.sh' .github/workflows/release.yml
          grep -q 'environment: cos-release' .github/workflows/release.yml
          grep -q './scripts/upload-release-to-cos.sh cos-upload browser-cli' .github/workflows/release.yml
          grep -q 'needs: \[build-linux, build-macos, build-windows\]' .github/workflows/release.yml
          ! grep -q 'skills/lexmount-browser/bin/' .github/workflows/release.yml
      - run: bash -n scripts/sign_and_notarize_macos.sh scripts/upload-release-to-cos.sh
      - run: sh -n scripts/package-skill.sh skills/lexmount-browser/scripts/bootstrap.sh skills/lexmount-browser/scripts/doctor.sh
      - name: Verify Skill platform selection and PATH isolation
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          mkdir -p "$test_dir/skill/scripts" "$test_dir/fake-path"
          cp skills/lexmount-browser/scripts/doctor.sh "$test_dir/skill/scripts/doctor.sh"
          ln -s /usr/bin/true "$test_dir/fake-path/browser-cli"
          set +e
          output="$(PATH="$test_dir/fake-path:/usr/bin:/bin" "$test_dir/skill/scripts/doctor.sh")"
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = '{"ok":false,"error":"command_not_found","message":"Skill-local browser-cli is missing. Run scripts/bootstrap.sh first."}'
          ! grep -q 'command -v browser-cli' skills/lexmount-browser/scripts/doctor.sh
          ! grep -q 'Get-Command browser-cli' skills/lexmount-browser/scripts/doctor.ps1
      - name: Test pinned bootstrap security
        run: ./tests/test_skill_bootstrap_security.py
      - name: Verify pinned Linux bootstrap
        run: sh skills/lexmount-browser/scripts/bootstrap.sh
      - name: Verify runtime packaging contract
        run: |
          ! grep -R -E 'python3[[:space:]]|python[[:space:]]+-m|uv[[:space:]]' scripts skills .github/workflows
      - name: Stage excluded Skill package fixtures
        run: |
          mkdir -p skills/lexmount-browser/bin
          printf 'macOS arm64 package fixture' > skills/lexmount-browser/bin/browser-cli
          printf 'Windows x64 package fixture' > skills/lexmount-browser/bin/browser-cli.exe
      - run: ./scripts/package-skill.sh
      - run: unzip -t dist/lexmount-browser.zip
      - name: Verify SkillHub ZIP root
        run: |
          unzip -Z1 dist/lexmount-browser.zip | grep -qx 'SKILL.md'
          ! unzip -Z1 dist/lexmount-browser.zip | grep -q '^lexmount-browser/'
          ! unzip -Z1 dist/lexmount-browser.zip | grep -q '^bin/'

  windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test release version consistency gate
        shell: powershell
        run: .\.github\scripts\test-release-version.ps1
      - name: Test published bootstrap version selection
        shell: powershell
        run: .\.github\scripts\test-select-bootstrap-version.ps1
      - name: Bootstrap from COS with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1" }
          & .\tests\test_skill_bootstrap_security.ps1
          & .\skills\lexmount-browser\scripts\bootstrap.ps1
          & .\skills\lexmount-browser\bin\browser-cli.exe version
          if ($LASTEXITCODE -ne 0) { throw "Installed browser-cli version check failed" }

  linux-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build static Linux binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Verify standalone Linux executable
        run: |
          binary="target/x86_64-unknown-linux-musl/release/browser-cli"
          if readelf --program-headers --wide "$binary" | grep -F 'Requesting program interpreter'; then
            echo 'Linux release binary is dynamically linked' >&2
            exit 1
          fi
          "$binary" version

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify standalone Windows executable
        shell: powershell
        run: |
          $binary = "target/x86_64-pc-windows-msvc/release/browser-cli.exe"
          & $binary version
          if ($LASTEXITCODE -ne 0) { throw "browser-cli version failed with exit code $LASTEXITCODE" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -property installationPath
          Import-Module "$installationPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installationPath -SkipAutomaticLocation
          $dependencies = & dumpbin.exe /dependents $binary
          $dependencies | Write-Output
          if ($dependencies -match '(?im)^\s+(?:VCRUNTIME|MSVCP)\d*[^\s]*\.dll\s*$') {
            throw "Windows release dynamically depends on the Visual C++ Redistributable"
          }
