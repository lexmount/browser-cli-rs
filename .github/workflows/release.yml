name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="browser-cli-v${version}-${{ matrix.target }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "target/${{ matrix.target }}/release" && 7z a "$GITHUB_WORKSPACE/$asset" browser-cli.exe)
          else
            tar -C "target/${{ matrix.target }}/release" -czf "$asset" browser-cli
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: browser-cli-v*-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - run: cat *.sha256 | sort -k2 > SHA256SUMS
      - run: rm -f -- *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            browser-cli-v*
            SHA256SUMS
