[package]
name = "lexmount-browser"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Native Rust SDK and CLI for Lexmount cloud browsers"
repository = "https://github.com/lexmount/browser-cli-rs"

[lib]
name = "lexmount_browser"
path = "src/lib.rs"

[[bin]]
name = "browser-cli"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
open = "5"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
url = "2"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
